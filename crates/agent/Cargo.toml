[package]
name = "effectcraft-agent"
description = "EffectCraft's in-app AI agent: provider adapters (Anthropic, OpenAI-compatible), the tool-use loop over engine commands, turn checkpoints and API key storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
effectcraft-engine = { workspace = true }
effectcraft-automation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Network and OS keychain: desktop only (the web build has no agent yet).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Same feature set as craft-update's, so the two share one build of ureq and rustls.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
effectcraft-host = { workspace = true }
